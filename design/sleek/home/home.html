<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full,
      .rounded-none,
      .rounded-t-full,
      .rounded-t-none,
      .rounded-r-full,
      .rounded-r-none,
      .rounded-b-full,
      .rounded-b-none,
      .rounded-l-full,
      .rounded-l-none,
      .rounded-s-full,
      .rounded-s-none,
      .rounded-e-full,
      .rounded-e-none,
      .rounded-tl-full,
      .rounded-tl-none,
      .rounded-tr-full,
      .rounded-tr-none,
      .rounded-bl-full,
      .rounded-bl-none,
      .rounded-br-full,
      .rounded-br-none,
      .rounded-ss-full,
      .rounded-ss-none,
      .rounded-se-full,
      .rounded-se-none,
      .rounded-es-full,
      .rounded-es-none,
      .rounded-ee-full,
      .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

        --background: #f8f7fc;
        --foreground: #18213d;
        --primary: #6c4dff;
        --primary-foreground: #ffffff;
        --secondary: #eeeafe;
        --secondary-foreground: #4b3aa8;
        --muted: #edecf4;
        --muted-foreground: #737992;
        --accent: #e9e4ff;
        --accent-foreground: #5a3fe0;
        --destructive: #d94c69;
        --card: #ffffff;
        --card-foreground: #18213d;
        --popover: #ffffff;
        --popover-foreground: #18213d;
        --border: #e8e6f0;
        --input: #ffffff;
        --ring: #6c4dff;
        --chart-1: #6c4dff;
        --chart-2: #8b74ff;
        --chart-3: #a89aff;
        --chart-4: #4a43b8;
        --chart-5: #d9d2ff;

        --font-sans: "Plus Jakarta Sans";
        --font-heading: "Plus Jakarta Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="min-h-screen bg-background text-foreground px-5 pt-5 pb-8">
      <div class="mx-auto w-full max-w-md">
        <header class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div
              class="relative flex size-9 items-center justify-center rounded-xl bg-primary text-primary-foreground shadow-[0_8px_20px_rgba(108,77,255,0.22)]"
            >
              <iconify-icon
                icon="solar:stars-minimalistic-bold"
                width="20"
                height="20"
              ></iconify-icon
              ><span class="absolute -right-0.5 -top-0.5 size-1.5 rounded-full bg-white"></span>
            </div>
            <span class="text-[17px] font-bold tracking-[-0.04em]"
              >NOVA <span class="font-medium text-muted-foreground">AI</span></span
            >
          </div>
          <button
            class="flex size-10 items-center justify-center rounded-full bg-card text-muted-foreground shadow-[0_6px_18px_rgba(24,33,61,0.06)]"
            aria-label="Abrir perfil"
          >
            <iconify-icon icon="solar:user-circle-linear" width="22" height="22"></iconify-icon>
          </button>
        </header>
        <section
          class="relative mt-8 overflow-hidden rounded-[28px] bg-gradient-to-br from-accent via-[#F5F2FF] to-background px-1 pt-3 pb-7"
        >
          <div class="pointer-events-none absolute right-7 top-5 text-primary/40">
            <iconify-icon
              icon="solar:stars-minimalistic-linear"
              width="28"
              height="28"
            ></iconify-icon>
          </div>
          <div
            class="pointer-events-none absolute right-14 top-12 size-1 rounded-full bg-primary/50"
          ></div>
          <div
            class="pointer-events-none absolute left-10 top-16 size-1.5 rounded-full bg-primary/30"
          ></div>
          <p class="relative text-[15px] font-medium text-muted-foreground">Hola 👋</p>
          <div class="relative mt-2 flex items-end gap-2">
            <h1
              class="font-heading max-w-[270px] text-[32px] font-bold leading-[1.08] tracking-[-0.055em]"
            >
              ¿Qué quieres hacer?
            </h1>
            <iconify-icon
              icon="solar:stars-minimalistic-bold"
              class="mb-1 text-primary"
              width="24"
              height="24"
            ></iconify-icon>
          </div>
        </section>
        <section class="mt-2">
          <div
            class="flex min-h-[88px] items-center gap-3 rounded-[24px] bg-card px-4 py-3 shadow-[0_12px_30px_rgba(24,33,61,0.08)] ring-1 ring-primary/10 focus-within:ring-2 focus-within:ring-primary/40"
          >
            <iconify-icon
              icon="solar:stars-minimalistic-linear"
              class="shrink-0 text-primary"
              width="24"
              height="24"
            ></iconify-icon
            ><input
              class="min-w-0 flex-1 bg-transparent text-[15px] text-foreground outline-none placeholder:text-muted-foreground"
              aria-label="Pregúntale algo a NOVA"
              placeholder="Pregúntale algo a NOVA…"
            /><button
              class="flex size-11 shrink-0 items-center justify-center rounded-full bg-primary text-primary-foreground shadow-[0_8px_16px_rgba(108,77,255,0.24)]"
              aria-label="Enviar pregunta"
            >
              <iconify-icon icon="solar:arrow-up-linear" width="20" height="20"></iconify-icon>
            </button>
          </div>
        </section>
        <section class="mt-8">
          <div class="mb-3 flex items-center justify-between">
            <h2 class="font-heading text-[18px] font-bold tracking-[-0.035em]">Accesos rápidos</h2>
            <iconify-icon
              icon="solar:magic-stick-3-linear"
              class="text-primary/60"
              width="20"
              height="20"
            ></iconify-icon>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <button
              class="min-h-[142px] rounded-[24px] bg-card p-4 text-left shadow-[0_10px_26px_rgba(24,33,61,0.065)] transition-transform active:scale-[0.98]"
            >
              <span
                class="mb-4 flex size-11 items-center justify-center rounded-2xl bg-[#EEEAFE] text-primary"
                ><iconify-icon
                  icon="solar:camera-linear"
                  width="24"
                  height="24"
                ></iconify-icon></span
              ><span class="block text-[15px] font-bold">Cámara</span
              ><span class="mt-1 block text-[11px] leading-[1.35] text-muted-foreground"
                >Analiza una foto</span
              ></button
            ><button
              class="min-h-[142px] rounded-[24px] bg-card p-4 text-left shadow-[0_10px_26px_rgba(24,33,61,0.065)] transition-transform active:scale-[0.98]"
            >
              <span
                class="mb-4 flex size-11 items-center justify-center rounded-2xl bg-[#EEEAFE] text-primary"
                ><iconify-icon
                  icon="solar:microphone-3-linear"
                  width="24"
                  height="24"
                ></iconify-icon></span
              ><span class="block text-[15px] font-bold">Voz</span
              ><span class="mt-1 block text-[11px] leading-[1.35] text-muted-foreground"
                >Habla con NOVA</span
              ></button
            ><button
              class="min-h-[142px] rounded-[24px] bg-card p-4 text-left shadow-[0_10px_26px_rgba(24,33,61,0.065)] transition-transform active:scale-[0.98]"
            >
              <span
                class="mb-4 flex size-11 items-center justify-center rounded-2xl bg-[#EEEAFE] text-primary"
                ><iconify-icon
                  icon="solar:document-text-linear"
                  width="24"
                  height="24"
                ></iconify-icon></span
              ><span class="block text-[15px] font-bold">Documento</span
              ><span class="mt-1 block text-[11px] leading-[1.35] text-muted-foreground"
                >Analiza un PDF</span
              ></button
            ><button
              class="min-h-[142px] rounded-[24px] bg-card p-4 text-left shadow-[0_10px_26px_rgba(24,33,61,0.065)] transition-transform active:scale-[0.98]"
            >
              <span
                class="mb-4 flex size-11 items-center justify-center rounded-2xl bg-[#EEEAFE] text-primary"
                ><iconify-icon
                  icon="solar:map-point-linear"
                  width="24"
                  height="24"
                ></iconify-icon></span
              ><span class="block text-[15px] font-bold">Ubicación</span
              ><span class="mt-1 block text-[11px] leading-[1.35] text-muted-foreground"
                >Encuentra lugares cerca</span
              >
            </button>
          </div>
        </section>
        <button
          class="mt-6 flex h-14 w-full items-center justify-center gap-2 rounded-2xl bg-primary text-[15px] font-bold text-primary-foreground shadow-[0_12px_24px_rgba(108,77,255,0.25)]"
        >
          <span>Abrir chat con NOVA</span
          ><iconify-icon icon="solar:arrow-right-linear" width="20" height="20"></iconify-icon>
        </button>
      </div>
    </main>
  </body>
</html>
